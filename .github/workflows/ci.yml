name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Aqua Security Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload image SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-${{ steps.meta.outputs.version }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Show SBOM manifest
        if: github.event_name != 'pull_request'
        env:
          SBOM_PATH: sbom.spdx.json
          ARTIFACT_NAME: image-sbom-${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path(os.environ["SBOM_PATH"]).read_text())
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def cell(value):
              return str(value or "N/A").replace("\\", "\\\\").replace("|", "\\|").replace("`", "\\`").replace("\n", " ").replace("<", "&lt;").replace(">", "&gt;")

          with summary.open("a", encoding="utf-8") as output:
              output.write("## Image SBOM manifest\n\n")
              output.write(f"- **Image:** `ghcr.io/{os.environ['GITHUB_REPOSITORY']}`\n")
              output.write(f"- **Digest:** `{os.environ['IMAGE_DIGEST']}`\n")
              output.write(f"- **SBOM format:** SPDX {cell(sbom.get('spdxVersion'))}\n")
              output.write(f"- **Download:** workflow artifact `{cell(os.environ['ARTIFACT_NAME'])}` (available for 90 days)\n\n")
              output.write("| Package | Version | SPDX ID |\n|---|---|---|\n")
              for package in sbom.get("packages", []):
                  output.write(f"| {cell(package.get('name'))} | {cell(package.get('versionInfo'))} | {cell(package.get('SPDXID'))} |\n")
          PY

      - name: Attest image SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true